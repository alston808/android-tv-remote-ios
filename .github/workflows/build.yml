name: Build Unsigned IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Make the repository's provided scripts executable
          chmod +x Scripts/generate-identity.sh
          chmod +x Scripts/package-ipa.sh
          
          # Inject code-signing bypass flags directly into the xcodebuild command
          sed -i '' 's/xcodebuild/xcodebuild CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO/g' Scripts/package-ipa.sh
          
          # Run the patched packaging script
          ./Scripts/package-ipa.sh
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          # The exact output name might depend on what package-ipa.sh produces,
          # but typically it will be placed in the build/ directory or root.
          path: "*.ipa"
