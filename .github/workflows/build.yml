name: Build Unsigned IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build the raw .app file in a predictable local directory
          xcodebuild clean build \
            -project RemoteControl.xcodeproj \
            -scheme RemoteControl \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # An IPA is just a ZIP archive containing a 'Payload' directory
          mkdir -p Payload
          
          # Move the compiled app into the Payload folder
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          
          # Zip the folder into the final artifact
          zip -r RemoteControl.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: RemoteControl.ipa
